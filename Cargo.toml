[package]
name = "squawkline"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.9", package = "gtk4" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"] }
irc = "1.1"
futures = "0.3"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
base64 = "0.22"
